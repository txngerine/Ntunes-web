<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NTunes — a music player that breathes with sound</title>
<meta name="description" content="NTunes is an ad-free, cross-platform music player built with Flutter — YouTube Music streaming, synced lyrics, offline downloads and a queue you control." />
<meta property="og:title" content="NTunes — music for a clearer mind" />
<meta property="og:description" content="Ad-free, cross-platform music streaming built with Flutter." />
<meta property="og:image" content="screenshots/now-playing.jpg" />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #000000;
    --black-2: #050505;
    --black-3: #0a0a0a;
    --line: #1a1a1a;
    --paper: #f2efe8;
    --grey: #8f8f93;
    --grey-dim: #5c5c60;
    --red: #8b0000;
    --orange: #a0001c;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html{ scroll-behavior: smooth; }
  html, body { background: var(--black); overflow-x: hidden; }

  body{
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    background: var(--black);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #root{ position: relative; }

  .mono{ font-family: 'JetBrains Mono', monospace; }

  .bg-grid{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(circle, rgba(242,239,232,0.055) 1px, transparent 1.2px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, black 40%, transparent 95%);
  }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 32px;
    position: relative;
    z-index: 1;
  }

  /* ---------- NAV ---------- */
  .nav{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 32px;
    position: relative;
    z-index: 50;
    flex-wrap: wrap;
    row-gap: 14px;
    gap: 16px;
  }
  .nav__brand{
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--grey);
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink: 0;
  }
  .nav__dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--red);
    display:inline-block;
  }
  .nav__coords{
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--grey-dim);
  }
  .nav__right{
    display:flex;
    align-items:center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .nav__link{
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: var(--grey);
    text-decoration: none;
    transition: color 0.2s ease;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
  .nav__link:hover{ color: var(--paper); }
  .nav__cta{
    font-size: 11.5px;
    letter-spacing: 0.06em;
    color: var(--black);
    background: var(--paper);
    padding: 9px 16px;
    border-radius: 999px;
    text-decoration: none;
    display:inline-flex;
    align-items:center;
    gap:7px;
    white-space: nowrap;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .nav__cta:hover{ transform: translateY(-1px); opacity: 0.9; }
  @media (max-width: 640px){
    .nav__coords{ display:none; }
  }
  @media (max-width: 520px){
    .nav{ padding: 18px 20px; }
    .nav__right{ gap: 14px; width: 100%; justify-content: space-between; }
  }

  /* ---------- SHARED BUTTONS ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 14px 26px;
    border-radius: 12px;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.2s ease, opacity 0.2s ease, border-color 0.2s ease;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn--primary{
    background: linear-gradient(180deg, var(--orange), var(--red));
    color: var(--paper);
  }
  .btn--primary:hover{ opacity: 0.92; }
  .btn--ghost{
    background: transparent;
    border-color: var(--line);
    color: var(--paper);
  }
  .btn--ghost:hover{ border-color: rgba(255,255,255,0.35); }
  .btn--block{ width: 100%; }
  @media (max-width: 480px){
    .btn{ font-size: 13.5px; padding: 13px 20px; }
  }

  /* ---------- HERO ---------- */
  .hero{
    min-height: 92vh;
    display:flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px 80px;
    position: relative;
  }
  .hero__eyebrow{
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--grey-dim);
    margin-bottom: 28px;
  }
  .hero__title{
    font-family: 'Major Mono Display', monospace;
    font-weight: 400;
    font-size: clamp(40px, 9vw, 96px);
    line-height: 1;
    letter-spacing: -0.01em;
    display:flex;
    align-items:center;
    gap: 18px;
    color: var(--paper);
  }
  .hero__title-dot{
    width: clamp(10px, 1.6vw, 16px);
    height: clamp(10px, 1.6vw, 16px);
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 24px 2px rgba(139,0,0,0.55);
    flex-shrink: 0;
  }
  .hero__tagline{
    margin-top: 26px;
    max-width: 480px;
    font-size: 16px;
    line-height: 1.6;
    color: var(--grey);
    font-weight: 400;
  }
  .hero__tagline b{ color: var(--paper); font-weight: 600; }

  .hero__pkg{
    margin-top: 22px;
    font-size: 12px;
    color: var(--grey-dim);
    letter-spacing: 0.06em;
  }
  .hero__pkg span{ color: var(--orange); }

  .hero__actions{
    margin-top: 34px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    flex-wrap: wrap;
  }

  @media (max-width: 480px){
    .hero{ padding: 32px 18px 64px; min-height: unset; }
    .hero__title{ gap: 12px; }
    .hero__actions{ flex-direction: column; width: 100%; }
    .hero__actions .btn{ width: 100%; }
  }

  /* ---------- WAVEFORM ---------- */
  .wave-panel{
    margin-top: 56px;
    width: min(560px, 90vw);
    border-radius: 18px;
    padding: 26px 22px 20px;
    background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.09);
    backdrop-filter: blur(6px);
  }
  .wave-panel__head{
    display:flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--grey-dim);
    margin-bottom: 16px;
  }
  .wave-panel__head b{ color: var(--grey); }
  .wave-bars{
    display:flex;
    align-items:center;
    justify-content: center;
    gap: 3px;
    height: 64px;
    overflow: hidden;
  }
  .wave-bar{
    width: 3px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--orange), var(--red));
    opacity: 0.85;
    flex-shrink: 0;
  }
  .wave-panel__time{
    display:flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 10.5px;
    color: var(--grey-dim);
  }
  .wave-panel__time .now{ color: var(--paper); }
  @media (max-width: 480px){
    .wave-panel{ padding: 20px 16px 16px; }
    .wave-panel__head{ flex-direction: column; gap: 4px; text-align: center; }
    .wave-panel__time span:nth-child(2){ display:none; }
    .wave-bars{ gap: 2px; height: 52px; }
  }

  .scroll-cue{
    margin-top: 54px;
    font-size: 10px;
    color: var(--grey-dim);
    letter-spacing: 0.2em;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }

  /* ---------- SCREENS (real app screenshots) ---------- */
  .screens-hero{
    margin-top: 64px;
    display:flex;
    justify-content: center;
    align-items: flex-end;
    gap: 28px;
  }
  .screens-grid{
    margin-top: 24px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }
  .screens-grid__label{
    margin-top: 88px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--grey-dim);
  }
  .shot{
    display:flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }
  .screens-hero .shot{ width: 260px; flex-shrink: 0; }
  .screens-hero .shot--feature{ width: 300px; }
  .phone{
    border-radius: 40px;
    padding: 9px;
    background: linear-gradient(160deg, #141414, #000000 60%);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 50px 100px -30px rgba(0,0,0,0.9);
  }
  .shot--feature .phone{
    box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 40px 120px -20px rgba(139,0,0,0.45);
  }
  .phone img{
    display:block;
    width: 100%;
    height: auto;
    aspect-ratio: 1206 / 2622;
    border-radius: 32px;
    background: var(--black-3);
  }
  .shot__cap{ padding: 0 6px; }
  .shot__num{
    font-size: 10.5px;
    color: var(--orange);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .shot__body{
    font-size: 13px;
    line-height: 1.55;
    color: var(--grey);
  }
  /* below desktop: both rows become swipeable strips */
  @media (max-width: 1000px){
    .screens-hero,
    .screens-grid{
      display:flex;
      align-items: flex-start;
      justify-content: flex-start;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 18px;
      margin-left: -32px;
      margin-right: -32px;
      padding: 0 32px 12px;
      scrollbar-width: none;
    }
    .screens-hero::-webkit-scrollbar,
    .screens-grid::-webkit-scrollbar{ display:none; }
    .screens-hero .shot,
    .screens-hero .shot--feature,
    .screens-grid .shot{ width: min(240px, 66vw); flex-shrink: 0; scroll-snap-align: center; }
    .screens-grid__label{ margin-top: 56px; }
  }
  @media (max-width: 480px){
    .screens-hero,
    .screens-grid{ margin-left: -20px; margin-right: -20px; padding: 0 20px 12px; }
    .phone{ border-radius: 34px; padding: 7px; }
    .phone img{ border-radius: 28px; }
  }

  /* ---------- SECTION SHARED ---------- */
  .section{
    position: relative;
    padding: 120px 0;
    border-top: 1px solid var(--line);
  }
  .section__label{
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--grey-dim);
    margin-bottom: 14px;
  }
  .section__title{
    font-size: clamp(26px, 4vw, 42px);
    font-weight: 700;
    letter-spacing: -0.01em;
    max-width: 640px;
    line-height: 1.2;
  }
  .section__title em{
    font-style: normal;
    color: var(--grey);
  }
  @media (max-width: 860px){
    .section{ padding: 88px 0; }
  }
  @media (max-width: 480px){
    .wrap{ padding: 0 20px; }
    .section{ padding: 64px 0; }
  }

  /* ---------- FEATURES ---------- */
  .feat-grid{
    margin-top: 56px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  @media (max-width: 860px){
    .feat-grid{ grid-template-columns: 1fr; }
  }
  .feat-card{
    background: var(--black-2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 30px 26px;
    position: relative;
    overflow: hidden;
  }
  .feat-card__icon{
    width: 34px; height: 34px;
    margin-bottom: 22px;
  }
  .feat-card__title{
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .feat-card__body{
    font-size: 14px;
    line-height: 1.6;
    color: var(--grey);
  }
  .feat-card__tag{
    position:absolute;
    top: 22px; right: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--grey-dim);
  }
  @media (max-width: 480px){
    .feat-card{ padding: 24px 20px; }
  }

  /* ---------- MANIFEST ---------- */
  .manifest{
    margin-top: 56px;
    max-width: 640px;
    background: var(--black-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .manifest__bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
  }
  .manifest__dot{ width:9px; height:9px; border-radius:50%; background: var(--line); }
  .manifest__bar span.file{
    margin-left: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--grey-dim);
  }
  .manifest__body{
    padding: 28px 24px 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.9;
    overflow-x: auto;
  }
  @media (max-width: 480px){
    .manifest__body{ padding: 22px 16px 20px; font-size: 12px; }
    .manifest__bar{ padding: 10px 14px; }
  }
  .manifest__key{ color: var(--grey-dim); }
  .manifest__val{ color: var(--paper); }
  .manifest__val.orange{ color: var(--orange); }
  .manifest__cursor{
    display:inline-block;
    width: 7px; height: 14px;
    background: var(--orange);
    margin-left: 4px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ---------- DATA FLOW ---------- */
  .flow-block{
    margin-top: 56px;
    display:flex;
    flex-direction: column;
    gap: 22px;
  }
  .flow-row{
    display:flex;
    align-items: flex-start;
    gap: 20px;
    padding: 22px 0;
    border-top: 1px solid var(--line);
  }
  .flow-row:first-child{ border-top: none; }
  .flow-row__num{
    font-size: 11px;
    color: var(--grey-dim);
    padding-top: 3px;
    flex-shrink: 0;
  }
  .flow-row__steps{
    display:flex;
    flex-wrap: wrap;
    row-gap: 10px;
  }
  .flow-step{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--paper);
    display:flex;
    align-items:center;
  }
  .flow-arrow{
    color: var(--orange);
    margin: 0 12px;
    font-size: 13px;
  }
  @media (max-width: 640px){
    .flow-step{ font-size: 11.5px; }
    .flow-arrow{ margin: 0 8px; }
  }

  /* ---------- PLATFORMS TREE ---------- */
  .platform-tree{
    margin-top: 52px;
    max-width: 560px;
    background: var(--black-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 30px 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    overflow-x: auto;
  }
  .platform-tree__root{
    display:flex;
    align-items:center;
    gap: 9px;
    color: var(--paper);
    font-weight: 700;
    margin-bottom: 14px;
    white-space: nowrap;
  }
  .platform-tree__root .nav__dot{ background: var(--orange); }
  .platform-tree__row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 5px 0;
    white-space: nowrap;
  }
  .platform-tree__branch{
    color: var(--grey-dim);
    flex-shrink: 0;
  }
  .platform-tree__name{
    color: var(--paper);
    font-weight: 600;
    min-width: 74px;
  }
  .platform-tree__arrow{ color: var(--grey-dim); flex-shrink: 0; }
  .platform-tree__tag{
    color: var(--orange);
  }
  @media (max-width: 480px){
    .platform-tree{ padding: 20px 18px 22px; font-size: 12px; }
    .platform-tree__name{ min-width: 62px; }
  }

  /* ---------- DOWNLOAD ---------- */
  .download-card{
    margin-top: 56px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 40px;
    background: var(--black-2);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 40px 44px;
    flex-wrap: wrap;
  }
  .download-card__info{ flex: 1 1 320px; min-width: 260px; }
  .download-card__badge{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--grey-dim);
    margin-bottom: 14px;
  }
  .download-card__badge .nav__dot{ background: var(--orange); }
  .download-card__heading{
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .download-card__body{
    font-size: 14px;
    line-height: 1.6;
    color: var(--grey);
    max-width: 420px;
  }
  .download-card__meta{
    margin-top: 18px;
    display:flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--grey-dim);
  }
  .download-card__meta b{ color: var(--paper); font-weight: 600; }
  .download-card__action{
    flex: 0 0 auto;
    display:flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .android-btn{
    display:inline-flex;
    align-items:center;
    gap: 12px;
    background: var(--paper);
    color: var(--black);
    padding: 14px 24px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14.5px;
    white-space: nowrap;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .android-btn:hover{ transform: translateY(-2px); opacity: 0.92; }
  .android-btn svg{ flex-shrink: 0; }
  .download-card__hint{
    font-size: 10.5px;
    color: var(--grey-dim);
    text-align: center;
  }
  .other-platforms-note{
    margin-top: 18px;
    font-size: 12px;
    color: var(--grey-dim);
  }
  @media (max-width: 720px){
    .download-card{ padding: 32px 28px; flex-direction: column; align-items: flex-start; text-align: left; }
    .download-card__action{ width: 100%; }
    .android-btn{ width: 100%; justify-content: center; }
  }
  @media (max-width: 480px){
    .download-card{ padding: 26px 20px; border-radius: 14px; margin-top: 40px; }
    .download-card__heading{ font-size: 18px; }
  }

  /* ---------- CONTACT / BUG REPORT ---------- */
  .contact-card{
    margin-top: 56px;
    max-width: 640px;
    background: var(--black-2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px 40px 40px;
  }
  .field{
    margin-bottom: 18px;
    display:flex;
    flex-direction: column;
    gap: 8px;
  }
  .field-row{
    display:flex;
    gap: 16px;
  }
  .field-row .field{ flex: 1 1 0; min-width: 0; }
  .field label{
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--grey-dim);
  }
  .field input,
  .field select,
  .field textarea{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--paper);
    background: var(--black-3);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s ease;
  }
  .field select{ cursor: pointer; }
  .field textarea{ resize: vertical; min-height: 110px; line-height: 1.5; font-family: 'Inter', sans-serif; }
  .field input::placeholder,
  .field textarea::placeholder{ color: var(--grey-dim); }
  .field input:focus,
  .field select:focus,
  .field textarea:focus{ border-color: var(--orange); }
  .field-error{ font-size: 11.5px; color: var(--red); }
  .contact-card__foot{
    margin-top: 8px;
    display:flex;
    align-items:center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .contact-card__status{
    font-size: 12.5px;
    color: var(--grey);
  }
  .contact-card__status.ok{ color: #7fd18a; }
  .contact-alt{
    margin-top: 20px;
    font-size: 12px;
    color: var(--grey-dim);
  }
  .contact-alt a{ color: var(--grey); }
  @media (max-width: 640px){
    .contact-card{ padding: 26px 22px 30px; }
    .field-row{ flex-direction: column; gap: 0; }
  }

  /* ---------- QUOTE ---------- */
  .quote{
    text-align:center;
    padding: 130px 0;
  }
  .quote__mark{
    font-family: 'Major Mono Display', monospace;
    font-size: clamp(24px, 3.4vw, 34px);
    line-height: 1.55;
    max-width: 760px;
    margin: 0 auto;
    color: var(--paper);
  }
  .quote__by{
    margin-top: 26px;
    font-size: 12px;
    color: var(--grey-dim);
    letter-spacing: 0.1em;
  }
  @media (max-width: 480px){
    .quote{ padding: 88px 0; }
  }

  /* ---------- FOOTER ---------- */
  .footer{

function Waveform(){

      arr.push(Math.max(6, Math.min(56, base)));
    }
    return arr;
  }, []);

  return html`
    <div className="wave-panel">
      <div className="wave-panel__head">
        <span>NOW PLAYING</span>
        <b>resolved via isolate — off the main thread</b>

      <div className="wave-bars">

          <${motion.div}
            key=${i}
            className="wave-bar"
            style=${{ height: h }}
            animate=${reduce ? {} : { scaleY: [0.4, 1, 0.55, 0.9, 0.4] }}
            transition=${{ duration: 1.6 + (i % 5) * 0.15, repeat: Infinity, ease: "easeInOut", delay: i * 0.035 }}

}

function Contact(){
  const [form, setForm] = useState({ name: "", email: "", type: "bug", message: "" });
  const [error, setError] = useState("");
  const [sent, setSent] = useState(false);

  const update = (key) => (e) => setForm({ ...form, [key]: e.target.value });

  const submit = (e) => {
    e.preventDefault();
    if (!form.email.trim() || !form.message.trim()){
      setError("Please add your email and a short description before sending.");
      setSent(false);
      return;
    }
    setError("");
    const subject = encodeURIComponent(`[NTunes ${form.type === "bug" ? "Bug report" : form.type === "feature" ? "Feature request" : "Feedback"}] from ${form.name || "anonymous"}`);
    const body = encodeURIComponent(
      `Type: ${form.type}\nName: ${form.name || "—"}\nEmail: ${form.email}\n\n${form.message}`
    );
    window.location.href = `mailto:${SUPPORT_EMAIL}?subject=${subject}&body=${body}`;
    setSent(true);
  };

  return html`
    <section className="section" id="contact">
      <div className="wrap">
        <${motion.div}
          initial=${{ opacity: 0, y: 20 }}
          whileInView=${{ opacity: 1, y: 0 }}
          viewport=${{ once: true }}
          transition=${{ duration: 0.6 }}
        >
          <div className="section__label mono">FOUND SOMETHING BROKEN?</div>
          <div className="section__title">Report a bug, <em>or just say hi.</em></div>
        <//>

        <${motion.form}
          className="contact-card"
          onSubmit=${submit}
          initial=${{ opacity: 0, y: 26 }}
          whileInView=${{ opacity: 1, y: 0 }}
          viewport=${{ once: true }}
          transition=${{ duration: 0.6, delay: 0.1 }}
        >
          <div className="field-row">
            <div className="field">
              <label htmlFor="c-name">Name</label>
              <input id="c-name" type="text" placeholder="Optional" value=${form.name} onChange=${update("name")} />
            </div>
            <div className="field">
              <label htmlFor="c-email">Email</label>
              <input id="c-email" type="email" placeholder="you@example.com" value=${form.email} onChange=${update("email")} required />
            </div>
          </div>

          <div className="field">
            <label htmlFor="c-type">Type</label>
            <select id="c-type" value=${form.type} onChange=${update("type")}>
              <option value="bug">Bug report</option>
              <option value="feature">Feature request</option>
              <option value="other">Something else</option>
            </select>
          </div>

          <div className="field">
            <label htmlFor="c-message">What happened?</label>
            <textarea id="c-message" placeholder="Steps to reproduce, what you expected, device & OS version…" value=${form.message} onChange=${update("message")} required></textarea>
          </div>

          ${error ? html`<div className="field-error">${error}</div>` : null}

          <div className="contact-card__foot">
            <button type="submit" className="btn btn--primary">Send report<//>
            ${sent ? html`<span className="contact-card__status ok">Opening your email client…<//>` : null}
          </div>

          <p className="contact-alt mono">
            Prefer email? Write directly to <a href=${`mailto:${SUPPORT_EMAIL}`}>${SUPPORT_EMAIL}</a>
          </p>
        <//>
      </div>
    </section>
  `;
}

function Quote(){
  return html`
    <section className="section quote">
      <div className="wrap">
        <${motion.p}
          className="quote__mark"
          initial=${{ opacity: 0, y: 24 }}
          whileInView=${{ opacity: 1, y: 0 }}
          viewport=${{ once: true }}
          transition=${{ duration: 0.8 }}
        >
          "music should play<br/>for everyone, uninterrupted."
        <//>
        <${motion.div}
          className="quote__by mono"
          initial=${{ opacity: 0 }}
          whileInView=${{ opacity: 1 }}
          viewport=${{ once: true }}
          transition=${{ duration: 0.6, delay: 0.3 }}
        >
          — AD-FREE STREAMING, FOR ALL
        <//>
      </div>
    </section>
  `;
}

    <footer className="footer">
      <div className="wrap">
        <div className="footer__row">
          <div className="footer__brand">
            NTUNES <span className="nav__dot"></span>
          </div>
          <div className="footer__links mono">
            <a href="#download">Download</a>
            <a href="#contact">Report a bug</a>
            <a href=${`mailto:${SUPPORT_EMAIL}`}>${SUPPORT_EMAIL}</a>
          </div>
          <div className="footer__coords">
            Kerala, India
          </div>
        </div>
        <div className="footer__meta mono">
          <span>package: ntunes</span>
          <span>flutter · getx · youtube music api</span>

function App(){
  return html`
    <div>
      <div className="bg-grid"></div>
      <${Nav} />
      <${Hero} />
      <${Screens} />
      <${Features} />
      <${DataFlow} />
      <${Manifest} />
